name: api

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - ".github/workflows/api.yml"
  pull_request:
    paths:
      - "apps/api/**"
      - ".github/workflows/api.yml"

permissions:
  contents: write

# Shared with the web workflow so two pipelines never push the manifests at the same time.
concurrency:
  group: deploy-manifests
  cancel-in-progress: false

env:
  IMAGE_NAME: docker.io/alejandrocald13/kubelab-api

jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7

      - name: Fetch test credentials from Doppler
        uses: dopplerhq/secrets-fetch-action@v2.0.0
        with:
          doppler-token: ${{ secrets.DOPPLER_TOKEN }}
          inject-env-vars: true

      # Started with docker run instead of services: services start before the steps,
      # when the Doppler variables do not exist yet.
      - name: Start PostgreSQL
        run: |
          docker run -d --name postgres -p 5432:5432 \
            -e POSTGRES_DB -e POSTGRES_USER -e POSTGRES_PASSWORD \
            postgres:17.11-alpine
          until docker exec postgres pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"; do sleep 2; done
          docker exec -i postgres psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
            < ../../k8s/apps/database/migrations/001_create_products.sql

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/api/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/api/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Run unit and integration tests
        run: |
          export DATABASE_URL="postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@localhost:5432/${POSTGRES_DB}"
          pnpm test

  build-and-deploy:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Fetch registry credentials from Doppler
        uses: dopplerhq/secrets-fetch-action@v2.0.0
        with:
          doppler-token: ${{ secrets.DOPPLER_TOKEN }}
          inject-env-vars: true

      - name: Short commit hash
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: apps/api
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ env.SHORT_SHA }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Update image tag in manifests
        working-directory: k8s/apps/api
        run: kustomize edit set image "${IMAGE_NAME}=${IMAGE_NAME}:${SHORT_SHA}"

      # A push made with GITHUB_TOKEN does not trigger other workflows, so there is no loop.
      - name: Commit manifest change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/apps/api/kustomization.yaml
          git commit -m "ci(api): deploy image ${SHORT_SHA}"
          git pull --rebase origin main
          git push origin HEAD:main
