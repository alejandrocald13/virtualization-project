# "resolve" re-resolves the Service name in the background, so a recreated Service (new
# ClusterIP) keeps working. If the DNS fails, nginx keeps the last known address, so the
# proxy survives an outage of CoreDNS. 10.43.0.10 is the cluster DNS Service in k3s.
upstream api {
    zone api 64k;
    resolver 10.43.0.10 valid=10s;
    server api.kubelab.svc.cluster.local:3000 resolve;
}

server {
    listen 8080;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri /index.html;
    }
}
