server {
    listen 8080;
    root /usr/share/nginx/html;

    location /api/ {
        # A literal name in proxy_pass is resolved only when nginx starts, so a recreated
        # Service (new ClusterIP) would break the proxy. The variable forces resolution at
        # request time. 10.43.0.10 is the cluster DNS Service in k3s.
        resolver 10.43.0.10 valid=10s;
        set $api_upstream http://api.kubelab.svc.cluster.local:3000;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri /index.html;
    }
}
