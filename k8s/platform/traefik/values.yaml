deployment:
  replicas: 2
service:
  type: LoadBalancer
  annotations:
    metallb.io/loadBalancerIPs: 10.60.129.240
ports:
  web:
    port: 8000
    exposedPort: 80
  websecure:
    expose:
      default: false
  postgres:
    port: 5432
    exposedPort: 5432
    protocol: TCP
    expose:
      default: true
providers:
  kubernetesCRD:
    enabled: true
  kubernetesIngress:
    enabled: false
accessLog:
  enabled: true
ingressRoute:
  dashboard:
    enabled: false
# The k6 load test took the working set to the old 128Mi limit.
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 512Mi
