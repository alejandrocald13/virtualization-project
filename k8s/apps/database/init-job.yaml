apiVersion: batch/v1
kind: Job
metadata:
  name: db-init
  namespace: kubelab
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 4
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: postgres:17.11-alpine
          command:
            - sh
            - -c
            - |
              until pg_isready; do sleep 2; done
              psql -v ON_ERROR_STOP=1 -f /migrations/001_create_products.sql &&
              psql -v ON_ERROR_STOP=1 \
                -v readonly_user="$DB_READONLY_USER" \
                -v readonly_password="$DB_READONLY_PASSWORD" \
                -f /migrations/002_readonly_role.sql
          env:
            - name: PGHOST
              value: postgres
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_USER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
            - name: PGDATABASE
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_DB
            - name: DB_READONLY_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: DB_READONLY_USER
            - name: DB_READONLY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: DB_READONLY_PASSWORD
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: migrations
              mountPath: /migrations
      volumes:
        - name: migrations
          configMap:
            name: db-migrations
