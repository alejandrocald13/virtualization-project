apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: kubelab
  labels:
    app: api
  annotations:
    secrets.doppler.com/reload: "true"
spec:
  # No replicas field: the HPA owns the replica count. If it were set here,
  # Argo CD self-heal would reset it every time the HPA scales.
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: /metrics
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: api
      # Default is 300 s: with a dead node, the app would run on one replica for 5 minutes.
      tolerations:
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 30
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 30
      # The image declares USER node by name; the kubelet can only verify
      # runAsNonRoot with a numeric id (node is uid 1000 in the official image).
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: api
          image: docker.io/alejandrocald13/kubelab-api
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - secretRef:
                name: api-credentials
          # Keep serving for a moment after the pod is marked for deletion, while Traefik
          # stops sending it requests. SIGTERM arrives after this sleep.
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          # Measured under the k6 load test: the working set peaks near 100Mi.
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
