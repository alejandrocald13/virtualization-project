apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: kubelab
  labels:
    app: web
spec:
  # No replicas field: the HPA owns the replica count (see the api Deployment).
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: web
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: web
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: web
      # Default is 300 s: with a dead node, the app would run on one replica for 5 minutes.
      tolerations:
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 30
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 30
      # nginx-unprivileged runs as uid 101; stated explicitly so runAsNonRoot can be verified.
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
      containers:
        - name: web
          image: docker.io/alejandrocald13/kubelab-web
          ports:
            - name: http
              containerPort: 8080
          # Keep serving for a moment after the pod is marked for deletion, while Traefik
          # stops sending it requests. SIGTERM arrives after this sleep.
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 16Mi
            limits:
              cpu: 250m
              memory: 64Mi
