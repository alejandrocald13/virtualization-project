apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: doppler-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-8"
spec:
  project: default
  source:
    repoURL: https://github.com/alejandrocald13/virtualization-project.git
    targetRevision: main
    path: k8s/platform/doppler-secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: doppler-operator-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
