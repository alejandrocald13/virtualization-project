configmapReload:
  prometheus:
    resources:
      requests:
        cpu: 5m
        memory: 16Mi
      limits:
        memory: 64Mi

server:
  # About 170 MB of TSDB per day: 7 days fit in the 4Gi volume.
  retention: "7d"
  # One replica: with the default 300 s, a dead node would leave Prometheus down for 5 minutes.
  tolerations:
    - key: node.kubernetes.io/not-ready
      operator: Exists
      effect: NoExecute
      tolerationSeconds: 30
    - key: node.kubernetes.io/unreachable
      operator: Exists
      effect: NoExecute
      tolerationSeconds: 30
  persistentVolume:
    enabled: true
    size: 4Gi
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 1Gi

scrapeConfigs:
  prometheus-pushgateway:
    enabled: false
  kubernetes-services:
    enabled: false
  # In k3s every component runs in one process, so the control plane kubelet
  # endpoint repeats all API server metrics. Both are dropped to save memory.
  kubernetes-api-servers:
    enabled: false
  kubernetes-nodes:
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: kubelet_.*|process_.*|go_goroutines
        action: keep

alertmanager:
  enabled: false
prometheus-pushgateway:
  enabled: false

kube-state-metrics:
  enabled: true
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 64Mi

prometheus-node-exporter:
  enabled: true
  resources:
    requests:
      cpu: 10m
      memory: 24Mi
    limits:
      memory: 48Mi
