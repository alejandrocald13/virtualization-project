configmapReload:
  prometheus:
    resources:
      requests:
        cpu: 5m
        memory: 16Mi
      limits:
        memory: 32Mi

server:
  retention: "1d"
  persistentVolume:
    enabled: true
    size: 4Gi
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi

scrapeConfigs:
  prometheus-pushgateway:
    enabled: false
  kubernetes-services:
    enabled: false
  # In k3s every component runs in one process, so the control plane kubelet
  # endpoint repeats all API server metrics. Both are dropped to save memory.
  kubernetes-api-servers:
    enabled: false
  kubernetes-nodes:
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: kubelet_.*|process_.*|go_goroutines
        action: keep

alertmanager:
  enabled: false
prometheus-pushgateway:
  enabled: false

kube-state-metrics:
  enabled: true
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 64Mi

prometheus-node-exporter:
  enabled: true
  resources:
    requests:
      cpu: 10m
      memory: 24Mi
    limits:
      memory: 48Mi
